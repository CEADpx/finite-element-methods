<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <style>
      .title { font: 600 30px 'DejaVu Sans', sans-serif; fill: #183b56; }
      .label { font: 26px 'DejaVu Sans', sans-serif; fill: #20252b; }
      .small { font: 24px 'DejaVu Sans', sans-serif; fill: #4b5563; }
      .card { fill: #fbfcfd; stroke: #cad5df; stroke-width: 2; rx: 14; }
      .geom { stroke: #d9772a; stroke-width: 5; }
      .field { stroke: #245b86; stroke-width: 5; }
      .gnode { fill: #d9772a; }
      .fnode { fill: #245b86; }
    </style>
  </defs>

  <rect x="20" y="20" width="360" height="390" class="card"/>
  <rect x="420" y="20" width="360" height="390" class="card"/>
  <rect x="820" y="20" width="360" height="390" class="card"/>

  <text x="200" y="67" text-anchor="middle" class="title">subparametric</text>
  <text x="600" y="67" text-anchor="middle" class="title">isoparametric</text>
  <text x="1000" y="67" text-anchor="middle" class="title">superparametric</text>

  <text x="55" y="128" class="label">geometry</text>
  <line x1="165" y1="120" x2="340" y2="120" class="geom"/>
  <circle cx="165" cy="120" r="10" class="gnode"/>
  <circle cx="340" cy="120" r="10" class="gnode"/>
  <text x="55" y="238" class="label">field</text>
  <line x1="165" y1="230" x2="340" y2="230" class="field"/>
  <circle cx="165" cy="230" r="10" class="fnode"/>
  <circle cx="252.5" cy="230" r="10" class="fnode"/>
  <circle cx="340" cy="230" r="10" class="fnode"/>
  <text x="200" y="310" text-anchor="middle" class="label">p<tspan baseline-shift="sub" font-size="18">g</tspan> &lt; p<tspan baseline-shift="sub" font-size="18">u</tspan></text>
  <text x="200" y="360" text-anchor="middle" class="small">lower-order geometry</text>

  <text x="455" y="128" class="label">geometry</text>
  <line x1="565" y1="120" x2="740" y2="120" class="geom"/>
  <circle cx="565" cy="120" r="10" class="gnode"/>
  <circle cx="652.5" cy="120" r="10" class="gnode"/>
  <circle cx="740" cy="120" r="10" class="gnode"/>
  <text x="455" y="238" class="label">field</text>
  <line x1="565" y1="230" x2="740" y2="230" class="field"/>
  <circle cx="565" cy="230" r="10" class="fnode"/>
  <circle cx="652.5" cy="230" r="10" class="fnode"/>
  <circle cx="740" cy="230" r="10" class="fnode"/>
  <line x1="565" y1="145" x2="565" y2="205" stroke="#98a6b3" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="652.5" y1="145" x2="652.5" y2="205" stroke="#98a6b3" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="740" y1="145" x2="740" y2="205" stroke="#98a6b3" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="600" y="310" text-anchor="middle" class="label">p<tspan baseline-shift="sub" font-size="18">g</tspan> = p<tspan baseline-shift="sub" font-size="18">u</tspan></text>
  <text x="600" y="360" text-anchor="middle" class="small">the same interpolation</text>

  <text x="855" y="128" class="label">geometry</text>
  <line x1="965" y1="120" x2="1140" y2="120" class="geom"/>
  <circle cx="965" cy="120" r="10" class="gnode"/>
  <circle cx="1052.5" cy="120" r="10" class="gnode"/>
  <circle cx="1140" cy="120" r="10" class="gnode"/>
  <text x="855" y="238" class="label">field</text>
  <line x1="965" y1="230" x2="1140" y2="230" class="field"/>
  <circle cx="965" cy="230" r="10" class="fnode"/>
  <circle cx="1140" cy="230" r="10" class="fnode"/>
  <text x="1000" y="310" text-anchor="middle" class="label">p<tspan baseline-shift="sub" font-size="18">g</tspan> &gt; p<tspan baseline-shift="sub" font-size="18">u</tspan></text>
  <text x="1000" y="360" text-anchor="middle" class="small">higher-order geometry</text>
</svg>
