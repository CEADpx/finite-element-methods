<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L0,10 L11,5 z" fill="#244f73"/>
    </marker>
    <style>
      .ref { fill: #dcecf5; stroke: #244f73; stroke-width: 4; }
      .phys { fill: #f3dfbd; stroke: #9a5a24; stroke-width: 4; }
      .refnode { fill: #244f73; }
      .physnode { fill: #c66b2b; }
      .map { stroke: #244f73; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .title { font: 600 30px 'DejaVu Sans', sans-serif; fill: #183b56; }
      .label { font: 26px 'DejaVu Sans', sans-serif; fill: #20252b; }
      .math { font: italic 30px 'DejaVu Serif', serif; fill: #183b56; }
      .small { font: 23px 'DejaVu Sans', sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <text x="205" y="45" text-anchor="middle" class="title">reference triangle</text>
  <text x="907" y="45" text-anchor="middle" class="title">physical triangle</text>

  <polygon points="85,360 355,360 85,105" class="ref"/>
  <circle cx="85" cy="360" r="9" class="refnode"/>
  <circle cx="355" cy="360" r="9" class="refnode"/>
  <circle cx="85" cy="105" r="9" class="refnode"/>
  <text x="42" y="398" class="label">x̂₁</text>
  <text x="345" y="398" class="label">x̂₂</text>
  <text x="39" y="93" class="label">x̂₃</text>

  <path d="M430 230 C520 170, 610 170, 690 230" class="map"/>
  <text x="560" y="145" text-anchor="middle" class="math">x = Fₑ(ξ)</text>
  <text x="560" y="282" text-anchor="middle" class="small">Fₑ(x̂ₐ) = xₐᵉ</text>

  <polygon points="760,355 1040,310 850,85" class="phys"/>
  <circle cx="760" cy="355" r="9" class="physnode"/>
  <circle cx="1040" cy="310" r="9" class="physnode"/>
  <circle cx="850" cy="85" r="9" class="physnode"/>
  <text x="710" y="394" class="label">x₁ᵉ</text>
  <text x="1030" y="350" class="label">x₂ᵉ</text>
  <text x="841" y="72" class="label">x₃ᵉ</text>
</svg>
